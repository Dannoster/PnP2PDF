[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp2pdf"
version = "3.0.0"
description = "Assemble print-and-play cards into a PDF."
requires-python = ">=3.11"
dependencies = ["Pillow>=13.0", "PySimpleGUI>=6.4"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Dannoster/PnP2PDF"

[project.scripts]
pnp2pdf = "pnp2pdf.app:main"
pnp2pdf-cli = "pnp2pdf.cli:main"

[tool.setuptools]
packages = ["pnp2pdf", "pnp2pdf.ui"]

[tool.setuptools.package-data]
pnp2pdf = ["color_profiles/*.icc", "icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
