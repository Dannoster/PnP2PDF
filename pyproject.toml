[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pnp2pdf"
version = "2.0.2"
description = "Assemble print-and-play cards into a PDF."
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "PySimpleGUI>=5.0"]

[project.urls]
Homepage = "https://github.com/Dannoster/PnP2PDF"

[project.scripts]
pnp2pdf = "pnp2pdf.app:main"

[tool.setuptools]
packages = ["pnp2pdf"]

[tool.setuptools.package-data]
pnp2pdf = ["color_profiles/*.icc", "icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
